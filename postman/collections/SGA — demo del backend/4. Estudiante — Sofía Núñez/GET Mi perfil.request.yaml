$kind: http-request
description: Perfil de la sesión. Hay que haber enviado antes el login de la estudiante.
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenEstudiante}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('El perfil respondió 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('El rol es estudiante', function () {
          pm.expect(pm.response.json().data.rol).to.eql('estudiante');
      });
    language: text/javascript
order: 2000
