$kind: http-request
description: Parámetros institucionales. La estudiante puede leerlos.
url: "{{baseUrl}}/parametros"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenEstudiante}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Los parámetros respondieron 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
