<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Matriz de Permisos por Perfil (RF1)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; text-align: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 14px; }
        th { background: #edf2f7; color: #2d3748; }
        td:first-child { text-align: left; font-weight: bold; color: #4a5568; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        button { padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #2c5282; }
    </style>
</head>
<body>

<div class="container">
    <h2>Matriz de Permisos por Perfil (RF1 / Control de Acceso)</h2>
    
    <form id="formPermisos">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left;">Módulo / Funcionalidad</th>
                    <th>Administrador</th>
                    <th>Coordinador</th>
                    <th>Docente</th>
                    <th>Estudiante</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Gestión de Usuarios (Alta/Baja)</td>
                    <td><input type="checkbox" checked disabled></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Estructura Académica (Sedes/Carreras)</td>
                    <td><input type="checkbox" checked disabled></td>
                    <td><input type="checkbox" checked></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Oferta Académica y Secciones</td>
                    <td><input type="checkbox" checked disabled></td>
                    <td><input type="checkbox" checked></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Consulta de Nómina de Estudiantes</td>
                    <td><input type="checkbox" checked disabled></td>
                    <td><input type="checkbox" checked></td>
                    <td><input type="checkbox" checked></td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Inscripción de Asignaturas</td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox"></td>
                    <td><input type="checkbox" checked></td>
                </tr>
            </tbody>
        </table>

        <button type="submit">Guardar Cambios en la Matriz</button>
    </form>
</div>

<script>
    document.getElementById('formPermisos').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Simulación de recopilación y almacenamiento de permisos por rol
        const checkboxes = document.querySelectorAll('input[type="checkbox"]:not(:disabled)');
        let contadorModificados = 0;
        
        checkboxes.forEach(cb => {
            if (cb.checked) contadorModificados++;
        });

        alert(`¡Matriz de permisos actualizada con éxito!\nSe han guardado las reglas de acceso para los perfiles del sistema.`);
    });
</script>

</body>
</html>
