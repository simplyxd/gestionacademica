<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi horario semanal · SGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons.min.css" />
  <style>
    /* ==========================================================
       SGA · Design tokens (ver system-design.md §2–§3)
       ========================================================== */
    :root {
      color-scheme: light dark;

      --navy-0:#EEF2FB; --navy-1:#D7E0F4; --navy-2:#B3C2E6; --navy-3:#8AA0D6; --navy-4:#6480C4;
      --navy-5:#4462AF; --navy-6:#2E4A95; --navy-7:#1F3777; --navy-8:#14285A; --navy-9:#0B1B3F;

      --indigo-0:#EEF0FC; --indigo-1:#DCE0F8; --indigo-2:#BCC3F0; --indigo-3:#98A3E6; --indigo-4:#7583DA;
      --indigo-5:#5766CC; --indigo-6:#4351B8; --indigo-7:#35409A; --indigo-8:#293178; --indigo-9:#1E2456;

      --amber-0:#FFF8E6; --amber-1:#FFEDC2; --amber-2:#FFDE94; --amber-3:#FFCC61; --amber-4:#F7B93A;
      --amber-5:#E6A420; --amber-6:#C98A12; --amber-7:#A36E0C; --amber-8:#7C5308; --amber-9:#563A05;

      --slate-0:#F8FAFC; --slate-1:#F1F5F9; --slate-2:#E2E8F0; --slate-3:#CBD5E1; --slate-4:#94A3B8;
      --slate-5:#64748B; --slate-6:#475569; --slate-7:#334155; --slate-8:#1E293B; --slate-9:#0F172A;

      --teal-0:#ECFDF7; --teal-1:#CDF7EA; --teal-2:#9EEFD7; --teal-3:#66E0BF; --teal-4:#34C9A4;
      --teal-5:#12AC89; --teal-6:#0B7F66; --teal-7:#0A6753; --teal-8:#0B5243; --teal-9:#083A30;

      --crimson-0:#FEF1F2; --crimson-1:#FDDDE0; --crimson-2:#FBBFC5; --crimson-3:#F7919C; --crimson-4:#EF5F6F;
      --crimson-5:#E23A4E; --crimson-6:#C4283B; --crimson-7:#A41F31; --crimson-8:#861C2C; --crimson-9:#6E1626;

      --orange-0:#FFF5EB; --orange-1:#FFE6CC; --orange-2:#FFCF99; --orange-3:#FFB05C; --orange-4:#FF9129;
      --orange-5:#F5760F; --orange-6:#D95E07; --orange-7:#B4480A; --orange-8:#90390D; --orange-9:#6E2D0C;

      --sky-0:#EFF8FF; --sky-1:#D9EEFF; --sky-2:#B6E0FF; --sky-3:#85CCFA; --sky-4:#4DB3F2;
      --sky-5:#2496E0; --sky-6:#0E6FB3; --sky-7:#0F5A91; --sky-8:#124B76; --sky-9:#10395A;

      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-2xl:48px;
      --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;

      --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
      --shadow-sm: 0 2px 8px rgba(15,23,42,.06);
      --shadow-md: 0 8px 24px rgba(15,23,42,.08);
      --shadow-lg: 0 16px 40px rgba(15,23,42,.10);

      --header-h:64px; --control-h:42px; --content-max:1320px;
      --hour-h:52px;

      --bg: var(--slate-0);
      --aurora-1: rgba(46,74,149,.08);
      --aurora-2: rgba(67,81,184,.07);
      --aurora-3: rgba(230,164,32,.06);
      --text: var(--slate-9);
      --text-dim: var(--slate-6);
      --text-dim-strong: var(--slate-5);
      --card-bg: #FFFFFF;
      --card-border: var(--slate-2);
      --surface-alt: var(--slate-1);
      --grid-line: rgba(148,163,184,.28);
      --primary: var(--navy-6);
      --primary-hover: var(--navy-7);
      --primary-text-on: #FFFFFF;
      --link: var(--navy-6);

      --glass-bg: rgba(255,255,255,.75);
      --glass-bg-strong: rgba(255,255,255,.88);
      --glass-bg-fallback: rgba(255,255,255,.97);
      --glass-border: rgba(0,0,0,.08);
      --glass-highlight: rgba(255,255,255,.30);
      --glass-shadow: 0 8px 32px 0 rgba(0,0,0,.07);
      --glass-blur: 12px;
      --glass-saturate: 180%;
    }

    [data-theme="dark"] {
      --bg: var(--slate-9);
      --aurora-1: rgba(100,128,196,.16);
      --aurora-2: rgba(117,131,218,.14);
      --aurora-3: rgba(247,185,58,.07);
      --text: var(--slate-1);
      --text-dim: var(--slate-4);
      --text-dim-strong: var(--slate-3);
      --card-bg: var(--slate-8);
      --card-border: var(--slate-7);
      --surface-alt: var(--slate-8);
      --grid-line: rgba(203,213,225,.14);
      --primary: var(--navy-5);
      --primary-hover: var(--navy-4);
      --primary-text-on: #FFFFFF;
      --link: var(--navy-4);

      --glass-bg: rgba(15,23,42,.80);
      --glass-bg-strong: rgba(15,23,42,.92);
      --glass-bg-fallback: rgba(15,23,42,.97);
      --glass-border: rgba(255,255,255,.14);
      --glass-highlight: rgba(255,255,255,.06);
      --glass-shadow: 0 8px 32px 0 rgba(0,0,0,.35);

      --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.32);
      --shadow-md: 0 8px 24px rgba(0,0,0,.38);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, var(--aurora-1) 0, transparent 50%),
        radial-gradient(at 100% 0%, var(--aurora-2) 0, transparent 50%),
        radial-gradient(at 50% 100%, var(--aurora-3) 0, transparent 55%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      min-height: 100dvh;
      font-feature-settings: 'tnum';
      -webkit-font-smoothing: antialiased;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .sga-code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--indigo-6);
    }
    [data-theme="dark"] .sga-code { color: var(--indigo-3); }

    .ic-14 { font-size: 14px; }
    .ic-16 { font-size: 16px; }
    .ic-18 { font-size: 18px; }
    .ic-20 { font-size: 20px; }
    .ic-22 { font-size: 22px; }

    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-sm); }

    /* ---------- Liquid Glass ---------- */
    .sga-glass {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 0 var(--glass-highlight);
    }
    .sga-glass-strong { background: var(--glass-bg-strong); }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .sga-glass { background: var(--glass-bg-fallback); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .sga-glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--glass-bg-fallback); }
    }

    /* ---------- Header ---------- */
    .sga-header { position: sticky; top: 0; z-index: 30; height: var(--header-h); border-bottom: 1px solid var(--glass-border); border-radius: 0; box-shadow: none; }
    .sga-header__inner {
      max-width: var(--content-max); margin: 0 auto; height: 100%; padding: 0 var(--sp-md);
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm);
    }
    .sga-brand { display: flex; align-items: baseline; gap: var(--sp-sm); min-width: 0; }
    .sga-brand strong { font-weight: 700; font-size: 18px; color: var(--navy-6); }
    [data-theme="dark"] .sga-brand strong { color: var(--navy-3); }
    .sga-brand span { color: var(--text-dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 720px) { .sga-brand span { display: none; } }
    .sga-header__right { display: flex; align-items: center; gap: var(--sp-sm); }
    .sga-role-badge { font-size: 12px; font-weight: 600; color: var(--text-dim); border: 1px solid var(--card-border); border-radius: 999px; padding: 4px 12px; background: var(--card-bg); }
    .sga-icon-toggle {
      width: 36px; height: 36px; border-radius: var(--r-md); border: 1px solid transparent; background: transparent; color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .sga-icon-toggle:hover { background: var(--surface-alt); }

    /* ---------- Layout ---------- */
    .sga-shell { padding: var(--sp-lg) var(--sp-md) var(--sp-2xl); }
    .sga-container { max-width: var(--content-max); margin: 0 auto; }
    .sga-breadcrumbs { font-size: 13px; color: var(--text-dim); margin-bottom: var(--sp-md); }
    .sga-breadcrumbs .sep { margin: 0 6px; color: var(--text-dim-strong); }
    .sga-breadcrumbs strong { color: var(--text); font-weight: 600; }

    /* ---------- Alert ---------- */
    .sga-alert { display: flex; gap: var(--sp-sm); align-items: flex-start; border-radius: var(--r-md); padding: var(--sp-sm) var(--sp-md); margin-bottom: var(--sp-lg); font-size: 13px; border: 1px solid transparent; }
    .sga-alert--sky { background: var(--sky-0); color: var(--sky-8); border-color: var(--sky-2); }
    [data-theme="dark"] .sga-alert--sky { background: rgba(36,150,224,.12); color: var(--sky-2); border-color: rgba(36,150,224,.3); }
    .sga-alert i { margin-top: 2px; flex-shrink: 0; }

    /* ---------- Page header ---------- */
    .sga-page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-md); flex-wrap: wrap; margin-bottom: var(--sp-lg); }
    .sga-page-header h1 { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 0 0 4px; }
    .sga-page-header__desc { color: var(--text-dim); font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sga-page-header__actions { display: flex; gap: var(--sp-sm); flex-wrap: wrap; align-items: center; }

    /* ---------- Badges ---------- */
    .sga-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1.7; white-space: nowrap; }
    .sga-badge--orange { background: var(--orange-0); color: var(--orange-8); }
    [data-theme="dark"] .sga-badge--orange { background: rgba(255,145,41,.16); color: var(--orange-2); }
    .sga-badge--indigo { background: var(--indigo-0); color: var(--indigo-7); }
    [data-theme="dark"] .sga-badge--indigo { background: rgba(87,102,204,.2); color: var(--indigo-2); }
    .sga-badge--sky { background: var(--sky-0); color: var(--sky-7); }
    [data-theme="dark"] .sga-badge--sky { background: rgba(36,150,224,.18); color: var(--sky-2); }
    .sga-badge--teal { background: var(--teal-0); color: var(--teal-7); }
    [data-theme="dark"] .sga-badge--teal { background: rgba(18,172,137,.16); color: var(--teal-2); }

    /* ---------- Buttons ---------- */
    .sga-btn {
      font: inherit; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px;
      height: var(--control-h); padding: 0 16px; border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer; white-space: nowrap;
      transition: background-color 120ms ease, color 120ms ease, transform 120ms ease;
    }
    .sga-btn:active { transform: translateY(1px); }
    .sga-btn--filled { background: var(--primary); color: var(--primary-text-on); }
    .sga-btn--filled:hover { background: var(--primary-hover); }
    .sga-btn--light { background: var(--navy-0); color: var(--navy-7); }
    [data-theme="dark"] .sga-btn--light { background: rgba(68,98,175,.18); color: var(--navy-2); }
    .sga-btn--light:hover { background: var(--navy-1); }
    [data-theme="dark"] .sga-btn--light:hover { background: rgba(68,98,175,.28); }
    .sga-btn--subtle { background: transparent; color: var(--text-dim); }
    .sga-btn--subtle:hover { background: var(--surface-alt); color: var(--text); }

    /* ---------- StatCards (glass, KPI) ---------- */
    .sga-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--sp-md); margin-bottom: var(--sp-lg); }
    .sga-stat-card {
      padding: var(--sp-md) var(--sp-lg); border-radius: var(--r-lg);
      display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-sm);
    }
    .sga-stat-card__label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0 0 6px; }
    .sga-stat-card__value { font-size: 26px; font-weight: 700; line-height: 1.1; margin: 0; }
    .sga-stat-card__hint { font-size: 12px; color: var(--text-dim); margin: 4px 0 0; }
    .sga-stat-card__icon {
      width: 42px; height: 42px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sga-stat-card__icon--navy { background: var(--navy-0); color: var(--navy-7); }
    [data-theme="dark"] .sga-stat-card__icon--navy { background: rgba(68,98,175,.2); color: var(--navy-2); }
    .sga-stat-card__icon--indigo { background: var(--indigo-0); color: var(--indigo-7); }
    [data-theme="dark"] .sga-stat-card__icon--indigo { background: rgba(87,102,204,.22); color: var(--indigo-2); }
    .sga-stat-card__icon--amber { background: var(--amber-0); color: var(--amber-8); }
    [data-theme="dark"] .sga-stat-card__icon--amber { background: rgba(230,164,32,.18); color: var(--amber-2); }

    /* ---------- Day segmented control (mobile) ---------- */
    .sga-days { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-md); }
    .sga-day-btn {
      font: inherit; font-size: 12.5px; font-weight: 600; min-width: 44px; height: 36px; padding: 0 10px;
      border-radius: var(--r-md); border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text); cursor: pointer;
    }
    .sga-day-btn.on { background: var(--primary); color: var(--primary-text-on); border-color: var(--primary); }

    /* ---------- Horario semanal (grid) — nunca glass, necesita color pleno ---------- */
    .sga-grid-wrap {
      overflow-x: auto; border: 1px solid var(--card-border); border-radius: var(--r-md);
      background: var(--card-bg); box-shadow: var(--shadow-sm); margin-bottom: var(--sp-lg);
    }
    .sga-grid {
      display: grid;
      grid-template-columns: 56px repeat(6, minmax(112px, 1fr));
      grid-template-rows: 40px repeat(12, var(--hour-h));
      min-width: 800px;
    }
    .sga-slot { border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); }
    .sga-dh, .sga-hh {
      position: sticky; z-index: 2;
      border-right: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border);
    }
    .sga-dh {
      top: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; background: var(--card-bg);
    }
    .sga-hh {
      left: 0; display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 3px 8px 0 0; font-size: 11px; color: var(--text-dim); background: var(--card-bg);
      transform: translateY(0);
    }
    .sga-bloque {
      margin: 2px; padding: 5px 7px; border-radius: var(--r-sm);
      overflow: hidden; cursor: pointer; font: inherit; font-size: 12px; text-align: left;
      display: flex; flex-direction: column; gap: 2px; border: 1px solid transparent;
      transition: box-shadow 120ms ease;
    }
    .sga-bloque:hover { box-shadow: var(--shadow-sm); z-index: 1; }
    .sga-bloque .code { font-weight: 700; font-family: var(--font-mono); font-size: 11.5px; }
    .sga-bloque .meta { font-size: 10.5px; opacity: .85; }

    /* Estado del bloque = inscrita (clase propia del docente) → indigo, per §5.5 */
    .sga-bloque--inscrita {
      background: var(--indigo-1); border-color: var(--indigo-3); color: var(--indigo-9);
    }
    [data-theme="dark"] .sga-bloque--inscrita {
      background: var(--indigo-9); border-color: var(--indigo-7); color: var(--indigo-1);
    }

    /* ---------- Leyenda ---------- */
    .sga-legend {
      border: 1px solid var(--card-border); border-radius: var(--r-md);
      background: var(--card-bg); box-shadow: var(--shadow-sm);
      padding: var(--sp-md) var(--sp-lg);
    }
    .sga-legend h2 { font-size: 13px; font-weight: 600; margin: 0 0 var(--sp-sm); color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
    .sga-legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
    .sga-legend li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--card-border); }
    .sga-legend li:last-child { border-bottom: none; padding-bottom: 0; }
    .sga-legend .linkish {
      font: inherit; border: none; background: none; cursor: pointer; padding: 0;
      color: var(--link); font-family: var(--font-mono); font-weight: 600; font-size: 13px;
    }
    .sga-legend .linkish:hover { text-decoration: underline; }
    .sga-legend .name { font-size: 13px; }
    .sga-legend .det { color: var(--text-dim); font-size: 12.5px; }

    /* ---------- Overlay / Modal ---------- */
    .sga-overlay { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); align-items: center; justify-content: center; padding: var(--sp-md); }
    .sga-overlay.open { display: flex; }
    .sga-modal { width: min(440px, 100%); max-height: 90vh; overflow: auto; border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
    .sga-modal__header { padding: var(--sp-md) var(--sp-lg); border-bottom: 1px solid var(--card-border); }
    .sga-modal__header h3 { margin: 0; font-size: 17px; font-weight: 600; }
    .sga-modal__body { padding: var(--sp-lg); display: flex; flex-direction: column; gap: var(--sp-sm); }
    .sga-modal__foot { padding: var(--sp-md) var(--sp-lg); border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: var(--sp-sm); }
    .sga-dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: var(--sp-sm); }
    .sga-dl dt { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--text-dim); margin: 0 0 3px; }
    .sga-dl dd { margin: 0; font-size: 14px; }

    .sga-cupo { display: flex; flex-direction: column; gap: 6px; }
    .sga-cupo__row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
    .sga-cupo__bar { height: 6px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; }
    .sga-cupo__bar > span { display: block; height: 100%; border-radius: 999px; }

    /* ---------- Toast ---------- */
    .sga-toast {
      position: fixed; top: 20px; right: 20px; z-index: 60; display: none; align-items: flex-start; gap: 10px;
      max-width: 360px; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-left: 3px solid var(--sky-6); border-radius: var(--r-md); box-shadow: var(--shadow-md); font-size: 13px; color: var(--text);
    }
    .sga-toast.show { display: flex; }
    .sga-toast i { color: var(--sky-6); margin-top: 1px; flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) { .sga-btn, .sga-bloque { transition: none; } }

    @media (max-width: 720px) {
      .sga-days { display: flex; }
      .sga-grid { min-width: 0; grid-template-columns: 48px 1fr; }
      .sga-grid.hide-0 .c0, .sga-grid.hide-1 .c1, .sga-grid.hide-2 .c2,
      .sga-grid.hide-3 .c3, .sga-grid.hide-4 .c4, .sga-grid.hide-5 .c5 { display: none; }
    }
  </style>
</head>
<body>
  <header class="sga-header sga-glass">
    <div class="sga-header__inner">
      <div class="sga-brand">
        <strong>SGA</strong>
        <span>Instituto Universitario Nueva Formación</span>
      </div>
      <div class="sga-header__right">
        <span class="sga-role-badge">Docente</span>
        <button type="button" class="sga-icon-toggle" id="btn-theme" aria-label="Cambiar esquema de color">
          <i class="ti ti-moon ic-18" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="sga-shell">
    <div class="sga-container">
      <nav class="sga-breadcrumbs" aria-label="Ruta de navegación">
        Portal docente <span class="sep">/</span> <strong>Mi horario</strong>
      </nav>

      <div class="sga-alert sga-alert--sky" role="note">
        <i class="ti ti-info-circle ic-18" aria-hidden="true"></i>
        <span>Vista de horario semanal disponible para estudiantes, solo lectura. Nómina y listado de secciones son otras pantallas.</span>
      </div>

      <div class="sga-page-header">
        <div>
          <h1>Mi horario semanal</h1>
          <p class="sga-page-header__desc">
            Ana Soto · Período 2026-1
            <span class="sga-badge sga-badge--orange"><i class="ti ti-clock-play ic-16" aria-hidden="true"></i>en curso</span>
          </p>
        </div>
        <div class="sga-page-header__actions">
          <button type="button" class="sga-btn sga-btn--light" id="btn-secciones">
            Mis secciones<i class="ti ti-arrow-right ic-16" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="sga-stats" id="summary" aria-label="Resumen del período"></div>

      <div class="sga-days" id="days" role="tablist" aria-label="Elegir día"></div>

      <div class="sga-grid-wrap">
        <div class="sga-grid" id="grid" role="grid" aria-label="Horario semanal"></div>
      </div>

      <div class="sga-legend">
        <h2>Secciones del período</h2>
        <ul id="leyenda"></ul>
      </div>
    </div>
  </div>

  <div class="sga-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sga-modal sga-glass sga-glass-strong">
      <div class="sga-modal__header">
        <h3 id="modal-title">Bloque</h3>
      </div>
      <div class="sga-modal__body" id="modal-body"></div>
      <div class="sga-modal__foot">
        <button type="button" class="sga-btn sga-btn--light" id="btn-nomina">
          <i class="ti ti-users ic-16" aria-hidden="true"></i>Ver nómina
        </button>
        <button type="button" class="sga-btn sga-btn--subtle" id="btn-cerrar">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="sga-toast" id="toast" role="status">
    <i class="ti ti-info-circle ic-18" aria-hidden="true"></i>
    <span id="toast-msg"></span>
  </div>

  <script>
    // ---------- Esquema de color: claro/oscuro con preferencia persistida ----------
    (function initTheme() {
      const stored = localStorage.getItem('sga-theme');
      const preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (preferDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
    function paintThemeIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const icon = document.querySelector('#btn-theme i');
      icon.className = 'ic-18 ti ' + (isDark ? 'ti-sun' : 'ti-moon');
    }
    document.getElementById('btn-theme').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sga-theme', next);
      paintThemeIcon();
    });
    paintThemeIcon();

    // Mock en memoria: portal docente, solo consulta (E9).
    const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    const HORA_INI = 8;
    const HORA_FIN = 20; // exclusivo: última fila es 19:00–20:00

    const MODALIDAD_BADGE = {
      presencial: "sga-badge--indigo",
      semipresencial: "sga-badge--sky",
      online: "sga-badge--teal",
    };

    // Secciones asignadas a este docente en el período.
    const secciones = [
      { id: "prg101a", codigo: "PRG101", nombre: "Intro. a la programación", seccion: "A", sede: "Sede Centro", sala: "Lab 201", modalidad: "presencial", jornada: "diurna", inscritos: 28, cupo: 32 },
      { id: "bd201b",  codigo: "BD201",  nombre: "Bases de datos",            seccion: "B", sede: "Sede Centro", sala: "Aula 14",  modalidad: "presencial", jornada: "diurna", inscritos: 22, cupo: 30 },
      { id: "web201c", codigo: "WEB201", nombre: "Desarrollo web",            seccion: "C", sede: "—",           sala: "Ambiente virtual", modalidad: "online", jornada: "vespertina", inscritos: 35, cupo: 40 },
    ];

    // Bloques: día 0=Lun … 5=Sáb; horas en punto (fin exclusivo).
    const bloques = [
      { id: "b1", seccionId: "prg101a", dia: 0, inicio: 8,  fin: 10 },
      { id: "b2", seccionId: "prg101a", dia: 2, inicio: 8,  fin: 10 },
      { id: "b3", seccionId: "bd201b",  dia: 1, inicio: 10, fin: 12 },
      { id: "b4", seccionId: "bd201b",  dia: 3, inicio: 10, fin: 12 },
      { id: "b5", seccionId: "web201c", dia: 4, inicio: 18, fin: 20 },
    ];

    const grid = document.getElementById("grid");
    const summary = document.getElementById("summary");
    const leyenda = document.getElementById("leyenda");
    const daysBar = document.getElementById("days");
    const overlay = document.getElementById("overlay");
    const toastEl = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    let seccionAbierta = null;
    let diaFiltro = 0; // en móvil, qué columna se muestra

    function seccionById(id) {
      return secciones.find((s) => s.id === id);
    }

    function toast(msg) {
      toastMsg.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => toastEl.classList.remove("show"), 3500);
    }

    // Estado de cupo centralizado (§5.6 CupoIndicator): <75% disponible, 75-99% crítico, 100% lleno.
    function estadoCupo(inscritos, cupo) {
      if (cupo <= 0 || inscritos >= cupo) return "lleno";
      return inscritos / cupo >= 0.75 ? "critico" : "disponible";
    }
    const CUPO_COLOR = { disponible: "var(--teal-6)", critico: "var(--orange-5)", lleno: "var(--crimson-6)" };
    const CUPO_LABEL = {
      disponible: "Cupo disponible",
      critico: "Cupos críticos",
      lleno: "Sin cupo",
    };

    // Fila CSS: hora 8 → row 2 (row 1 es el encabezado de días).
    function filaHora(h) {
      return h - HORA_INI + 2;
    }

    function horasSemana() {
      return bloques.reduce((acc, b) => acc + (b.fin - b.inicio), 0);
    }

    // Pinta encabezados, celdas vacías y bloques posicionados en la grilla.
    function renderGrid() {
      grid.innerHTML = "";
      grid.className = "sga-grid hide-" + [0,1,2,3,4,5].filter((d) => d !== diaFiltro).join(" hide-");

      const corner = document.createElement("div");
      corner.className = "sga-dh";
      corner.style.gridColumn = "1";
      corner.style.gridRow = "1";
      corner.style.left = "0";
      grid.appendChild(corner);

      DIAS.forEach((nombre, d) => {
        const h = document.createElement("div");
        h.className = "sga-dh c" + d;
        h.textContent = nombre;
        h.style.gridColumn = String(d + 2);
        h.style.gridRow = "1";
        grid.appendChild(h);
      });

      for (let h = HORA_INI; h < HORA_FIN; h++) {
        const label = document.createElement("div");
        label.className = "sga-hh tabular";
        label.textContent = String(h).padStart(2, "0") + ":00";
        label.style.gridColumn = "1";
        label.style.gridRow = String(filaHora(h));
        grid.appendChild(label);

        DIAS.forEach((_, d) => {
          const cell = document.createElement("div");
          cell.className = "sga-slot c" + d;
          cell.style.gridColumn = String(d + 2);
          cell.style.gridRow = String(filaHora(h));
          grid.appendChild(cell);
        });
      }

      bloques.forEach((b) => {
        const s = seccionById(b.seccionId);
        const el = document.createElement("button");
        el.type = "button";
        el.className = "sga-bloque sga-bloque--inscrita c" + b.dia;
        el.dataset.bloque = b.id;
        el.style.gridColumn = String(b.dia + 2);
        el.style.gridRow = filaHora(b.inicio) + " / " + filaHora(b.fin);
        el.setAttribute(
          "aria-label",
          s.codigo + "-" + s.seccion + " " + s.nombre + ", " + DIAS[b.dia] + " " +
          String(b.inicio).padStart(2, "0") + ":00 a " + String(b.fin).padStart(2, "0") + ":00"
        );
        el.innerHTML =
          "<span class='code'>" + s.codigo + "-" + s.seccion + "</span>" +
          "<span class='meta tabular'>" + String(b.inicio).padStart(2, "0") + ":00–" +
            String(b.fin).padStart(2, "0") + ":00 · " + s.sala + "</span>";
        grid.appendChild(el);
      });
    }

    function renderSummary() {
      summary.innerHTML =
        "<div class='sga-stat-card sga-glass'>" +
          "<div><p class='sga-stat-card__label'>Secciones</p><p class='sga-stat-card__value tabular'>" + secciones.length + "</p></div>" +
          "<div class='sga-stat-card__icon sga-stat-card__icon--navy'><i class='ti ti-layout-grid ic-22' aria-hidden='true'></i></div>" +
        "</div>" +
        "<div class='sga-stat-card sga-glass'>" +
          "<div><p class='sga-stat-card__label'>Bloques</p><p class='sga-stat-card__value tabular'>" + bloques.length + "</p></div>" +
          "<div class='sga-stat-card__icon sga-stat-card__icon--indigo'><i class='ti ti-calendar-time ic-22' aria-hidden='true'></i></div>" +
        "</div>" +
        "<div class='sga-stat-card sga-glass'>" +
          "<div><p class='sga-stat-card__label'>Horas / semana</p><p class='sga-stat-card__value tabular'>" + horasSemana() + "</p>" +
            "<p class='sga-stat-card__hint'>jornada mixta (diurna + vespertina)</p></div>" +
          "<div class='sga-stat-card__icon sga-stat-card__icon--amber'><i class='ti ti-clock ic-22' aria-hidden='true'></i></div>" +
        "</div>";
    }

    function renderLeyenda() {
      leyenda.innerHTML = "";
      secciones.forEach((s) => {
        const li = document.createElement("li");
        li.innerHTML =
          "<button type='button' class='linkish' data-seccion='" + s.id + "'>" + s.codigo + "-" + s.seccion + "</button>" +
          "<span class='name'>" + s.nombre + "</span>" +
          "<span class='sga-badge " + MODALIDAD_BADGE[s.modalidad] + "'>" + s.modalidad + "</span>" +
          "<span class='det'>" + s.sede + " · " + s.sala + "</span>";
        leyenda.appendChild(li);
      });
    }

    function renderDays() {
      daysBar.innerHTML = "";
      DIAS.forEach((nombre, d) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sga-day-btn" + (d === diaFiltro ? " on" : "");
        btn.dataset.dia = String(d);
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", d === diaFiltro ? "true" : "false");
        btn.textContent = nombre;
        daysBar.appendChild(btn);
      });
    }

    function abrirBloque(id) {
      const b = bloques.find((x) => x.id === id);
      const s = seccionById(b.seccionId);
      seccionAbierta = s.id;
      modalTitle.textContent = s.codigo + "-" + s.seccion + " · " + s.nombre;

      const estado = estadoCupo(s.inscritos, s.cupo);
      const pct = s.cupo > 0 ? Math.min(100, Math.round((s.inscritos / s.cupo) * 100)) : 100;

      modalBody.innerHTML =
        "<dl class='sga-dl'>" +
          "<div><dt>Horario</dt><dd>" + DIAS[b.dia] + " " +
            String(b.inicio).padStart(2, "0") + ":00–" + String(b.fin).padStart(2, "0") + ":00</dd></div>" +
          "<div><dt>Sede / sala</dt><dd>" + s.sede + " · " + s.sala + "</dd></div>" +
          "<div><dt>Modalidad / jornada</dt><dd>" + s.modalidad + " · " + s.jornada + "</dd></div>" +
          "<div><dt>Inscritos</dt><dd>" +
            "<div class='sga-cupo'>" +
              "<div class='sga-cupo__row'><span class='tabular'>" + s.inscritos + "/" + s.cupo + "</span>" +
                "<span style='color:" + CUPO_COLOR[estado] + ";font-weight:600;'>" + CUPO_LABEL[estado] + "</span></div>" +
              "<div class='sga-cupo__bar' role='progressbar' aria-valuenow='" + pct + "' aria-valuemin='0' aria-valuemax='100'>" +
                "<span style='width:" + pct + "%;background:" + CUPO_COLOR[estado] + ";'></span>" +
              "</div>" +
            "</div>" +
          "</dd></div>" +
        "</dl>";
      overlay.classList.add("open");
    }

    function closeModal() {
      overlay.classList.remove("open");
      seccionAbierta = null;
    }

    function render() {
      renderSummary();
      renderDays();
      renderGrid();
      renderLeyenda();
    }

    // Click en un bloque de la grilla → detalle.
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-bloque]");
      if (btn) abrirBloque(btn.dataset.bloque);
    });

    // En móvil, elige qué día se ve.
    daysBar.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-dia]");
      if (!btn) return;
      diaFiltro = Number(btn.dataset.dia);
      render();
    });

    // Leyenda: abre el primer bloque de esa sección.
    leyenda.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-seccion]");
      if (!btn) return;
      const b = bloques.find((x) => x.seccionId === btn.dataset.seccion);
      if (b) abrirBloque(b.id);
    });

    document.getElementById("btn-cerrar").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
    overlay.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
    document.getElementById("btn-nomina").addEventListener("click", () => {
      toast("Otra pantalla (E9-2): nómina de inscritos de la sección.");
    });
    document.getElementById("btn-secciones").addEventListener("click", () => {
      toast("Otra pantalla (E9-1): listado de secciones del período.");
    });

    render();
  </script>
</body>
</html>
