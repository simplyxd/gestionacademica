<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>[E1-3] Wireframe: Alta de Usuario con Campos Condicionales</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #4a5568; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        .hidden { display: none; }
        .conditional { background: #f7fafc; padding: 12px; border: 1px dashed #cbd5e0; border-radius: 4px; margin-bottom: 15px; }
        button { width: 100%; padding: 10px; background: #2b6cb0; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2c5282; }
    </style>
</head>
<body>

<div class="card">
    <h2>[E1-3] Alta de Usuario (RF1 / CU4)</h2>
    <form id="formRegistro">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre" required placeholder="Ej. Ana Pérez">
        </div>
        <div class="form-group">
            <label>Correo Institucional</label>
            <input type="email" id="email" required placeholder="usuario@universidad.edu">
        </div>
        <div class="form-group">
            <label>Perfil de Usuario</label>
            <select id="perfil" required onchange="cambiarCampos()">
                <option value="">-- Seleccione Perfil --</option>
                <option value="Administrador">Administrador</option>
                <option value="Coordinador">Coordinador Académico</option>
                <option value="Docente">Docente</option>
                <option value="Estudiante">Estudiante</option>
            </select>
        </div>

        <!-- Campos condicionales para Estudiante -->
        <div id="secEstudiante" class="conditional hidden">
            <label style="color:#2b6cb0;">Datos de Estudiante</label>
            <div class="form-group" style="margin-bottom:0;">
                <label>Carrera</label>
                <select id="carrera">
                    <option value="Informatica">Ingeniería en Informática</option>
                    <option value="Administracion">Administración de Empresas</option>
                </select>
            </div>
        </div>

        <!-- Campos condicionales para Docente -->
        <div id="secDocente" class="conditional hidden">
            <label style="color:#2b6cb0;">Datos de Docente</label>
            <div class="form-group" style="margin-bottom:0;">
                <label>Sede Asignada</label>
                <select id="sedeDocente">
                    <option value="Central">Sede Central</option>
                    <option value="Norte">Sede Norte</option>
                </select>
            </div>
        </div>

        <button type="submit">Registrar Usuario</button>
    </form>
</div>

<script>
    function cambiarCampos() {
        const perfil = document.getElementById('perfil').value;
        const secEstudiante = document.getElementById('secEstudiante');
        const secDocente = document.getElementById('secDocente');

        secEstudiante.classList.add('hidden');
        secDocente.classList.add('hidden');

        if (perfil === 'Estudiante') {
            secEstudiante.classList.remove('hidden');
        } else if (perfil === 'Docente') {
            secDocente.classList.remove('hidden');
        }
    }

    document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('¡Usuario registrado correctamente con validación de campos condicionales!');
        this.reset();
        cambiarCampos();
    });
</script>

</body>
</html>
