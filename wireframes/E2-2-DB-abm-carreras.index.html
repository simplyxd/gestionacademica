<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wireframe 2 - ABM de Carreras</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; text-align: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f7fafc; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .full { grid-column: span 2; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; color: #4a5568; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px; background: #2b6cb0; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #2c5282; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
        th { background: #edf2f7; color: #2d3748; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>ABM de Carreras (RF2)</h2>
    <form id="formCarrera">
        <div class="form-grid">
            <div class="full">
                <label>Nombre de Carrera</label>
                <input type="text" id="nombreCarrera" required placeholder="Ej. Ingeniería Civil">
            </div>
            <div>
                <label>Sede</label>
                <select id="sedeCarrera">
                    <option value="Central">Central</option>
                    <option value="Norte">Norte</option>
                </select>
            </div>
            <div>
                <label>Modalidad</label>
                <select id="modalidadCarrera">
                    <option value="Presencial">Presencial</option>
                    <option value="Online">Online</option>
                </select>
            </div>
            <div>
                <label>Jornada</label>
                <select id="jornadaCarrera">
                    <option value="Diurna">Diurna</option>
                    <option value="Vespertina">Vespertina</option>
                </select>
            </div>
            <div>
                <label>Duración (Semestres)</label>
                <input type="number" id="duracionCarrera" required min="1" placeholder="8">
            </div>
            <div class="full">
                <button type="submit">Guardar Carrera (Alta)</button>
            </div>
        </div>
    </form>

    <h3>Listado de Carreras</h3>
    <table>
        <thead>
            <tr>
                <th>Carrera</th>
                <th>Sede</th>
                <th>Modalidad</th>
                <th>Jornada</th>
                <th>Duración</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo">
            <tr>
                <td>Ingeniería en Informática</td>
                <td>Central</td>
                <td>Presencial</td>
                <td>Diurna</td>
                <td>8 semestres</td>
                <td><button class="btn-del" onclick="eliminarFila(this)">Eliminar</button></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    document.getElementById('formCarrera').addEventListener('submit', function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombreCarrera').value;
        const sede = document.getElementById('sedeCarrera').value;
        const modalidad = document.getElementById('modalidadCarrera').value;
        const jornada = document.getElementById('jornadaCarrera').value;
        const duracion = document.getElementById('duracionCarrera').value;

        const tbody = document.getElementById('tablaCuerpo');
        const nuevaFila = document.createElement('tr');
        nuevaFila.innerHTML = `
            <td>${nombre}</td>
            <td>${sede}</td>
            <td>${modalidad}</td>
            <td>${jornada}</td>
            <td>${duracion} semestres</td>
            <td><button class="btn-del" onclick="eliminarFila(this)">Eliminar</button></td>
        `;
        tbody.appendChild(nuevaFila);
        this.reset();
    });

    function eliminarFila(btn) {
        btn.closest('tr').remove();
    }
</script>

</body>
</html>
